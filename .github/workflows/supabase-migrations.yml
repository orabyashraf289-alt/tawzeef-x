name: Supabase historical migration audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-migrations.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-migrations:
    name: Replay database migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - name: Check migration filenames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = list(Path('supabase/migrations').glob('*.sql'))
          invalid = [str(path) for path in paths if not re.fullmatch(r'\d{14}_.+\.sql', path.name)]
          versions = [path.name[:14] for path in paths]
          if invalid or len(set(versions)) != len(versions):
              raise SystemExit(f'Invalid migration names: {invalid}; duplicate versions: {len(versions) - len(set(versions))}')
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start database and replay migrations
        run: supabase db start
      - name: Verify isolated schema guardrails
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF has_function_privilege('authenticated', 'public.delete_company_permanently(uuid,uuid)', 'EXECUTE')
               OR has_function_privilege('anon', 'public.delete_company_permanently(uuid,uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Client roles must not execute permanent deletion';
            END IF;
            IF to_regprocedure('public.delete_company_cascade(uuid)') IS NOT NULL THEN
              RAISE EXCEPTION 'Legacy client deletion RPC must remain archived';
            END IF;
            IF to_regprocedure('public.create_agency_account(text,text,text,text,uuid,uuid)') IS NOT NULL THEN
              RAISE EXCEPTION 'Unsafe account provisioning function is active';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.webhook_deliveries'::regclass) THEN
              RAISE EXCEPTION 'Webhook delivery RLS must be enabled';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename IN ('candidates', 'applications', 'candidate_scorecards')
                AND cmd = 'SELECT'
                AND roles && ARRAY['anon'::name, 'public'::name]
            ) THEN
              RAISE EXCEPTION 'Candidate and application records must not have public SELECT policies';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename IN ('candidates', 'applications', 'candidate_scorecards')
                AND (
                  regexp_replace(COALESCE(qual, ''), '[ ()]', '', 'g') = 'true'
                  OR regexp_replace(COALESCE(with_check, ''), '[ ()]', '', 'g') = 'true'
                )
            ) THEN
              RAISE EXCEPTION 'Candidate and application policies must remain tenant scoped';
            END IF;
            IF pg_get_functiondef('public.is_super_admin(uuid)'::regprocedure) ILIKE '%user_metadata%'
               OR pg_get_functiondef('public.is_super_admin(uuid)'::regprocedure) ILIKE '%tx@tawzeefx.com%' THEN
              RAISE EXCEPTION 'Super-admin authorization must not trust signup metadata or email';
            END IF;
            IF pg_get_functiondef('public.is_super_admin_user()'::regprocedure) ILIKE '%user_roles%'
               OR pg_get_functiondef('public.is_super_admin_user()'::regprocedure) ILIKE '%app_role%' THEN
              RAISE EXCEPTION 'A tenant admin must not become a platform super-admin';
            END IF;
            IF to_regprocedure('public.get_auth_triggers()') IS NOT NULL THEN
              RAISE EXCEPTION 'Privileged Auth diagnostic must not be exposed';
            END IF;
          END $$;
          SQL
      - name: Verify custom role tenant isolation
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/custom_roles_rls.sql
      - name: Verify granular permission isolation and upsert
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/granular_permissions_rls.sql
      - name: Verify branch invitation tenant and email checks
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/branch_invitations.sql
      - name: Verify automation draft and log tenant isolation
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/automation_rls.sql
      - name: Verify internal automation execution and tenant checks
        # Execution checks use synthetic records and roll back every change.
        # No outgoing channel is called by the internal automation runtime.
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/automation_runtime.sql
      - name: Verify indexing log tenant isolation and server-only writes
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/google_indexing_logs_rls.sql
      - name: Verify platform role self-read and denied privilege escalation
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/platform_roles_rls.sql
      - name: Verify notification template tenant and editor permissions
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/notification_templates_rls.sql
      - name: Verify server-only Auth lookup and internal trigger access
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/legacy_auth_helper_access.sql
      - name: Stop local database
        if: always()
        run: supabase stop
