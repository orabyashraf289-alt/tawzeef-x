name: CI / Quality & Test Pipeline
# Automated CI & Quality Assurance Pipeline

on:
  push:
    branches: [ main, dev, 'fix/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Vitest Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reject migrations that delete authentication users
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          unsafe = [
              str(path)
              for path in Path('supabase/migrations').glob('*.sql')
              if re.search(r'\bDELETE\s+FROM\s+auth\.users\b', path.read_text(), re.I)
          ]
          if unsafe:
              print('Authentication user deletion is not allowed in active migrations:')
              print('\n'.join(unsafe))
              sys.exit(1)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Node tooling types
        run: npx tsc -p tsconfig.node.json --noEmit

      # The frontend has existing TypeScript errors. Report the real check
      # without presenting the empty root tsconfig as a passing type check.
      - name: Report frontend TypeScript errors
        continue-on-error: true
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Run Unit & Integration Tests
        run: npx vitest run

      - name: Production Build
        run: npm run build
