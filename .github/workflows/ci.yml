name: CI / Quality & Test Pipeline
# Automated CI & Quality Assurance Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Vitest Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        # NOTE: plain `tsc --noEmit` silently checks ZERO files here, because the
        # root tsconfig.json only declares `references` (only followed by `tsc -b`,
        # not plain `tsc`). This step was passing unconditionally regardless of
        # real type errors. Using -p to point at the actual project fixes that.
        # continue-on-error is temporary: the codebase currently has ~275
        # pre-existing type errors surfaced now that this check is real. Remove
        # continue-on-error once that backlog is paid down so this step blocks
        # merges like it always should have.
        run: npx tsc -p tsconfig.app.json
        continue-on-error: true

      - name: Run Unit & Integration Tests
        run: npx vitest run

      - name: Production Build
        run: npm run build
