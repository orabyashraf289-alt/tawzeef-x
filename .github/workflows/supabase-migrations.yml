name: Supabase historical migration audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-migrations.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-migrations:
    name: Replay database migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start database and replay migrations
        run: supabase db start
      - name: Stop local database
        if: always()
        run: supabase stop
