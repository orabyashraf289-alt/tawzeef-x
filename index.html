    <style id="tx-boot-style">
      html.dark { background-color: #0b111c; color-scheme: dark; }
      html.light { background-color: #f7f9fc; color-scheme: light; }
      html.tx-js-booting body {
        margin: 0;
        min-height: 100vh;
        background-color: inherit;
      }
      html.tx-js-booting [data-seo-prerender] {
        display: none !important;
      }
      html.tx-js-booting #root {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      html.tx-js-booting #root::after {
        content: "";
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        border: 3px solid rgba(13, 92, 90, 0.18);
        border-top-color: #0d5c5a;
        opacity: 0;
        animation: tx-boot-spin 0.7s linear infinite, tx-boot-reveal 0.2s ease 0.15s forwards;
      }
      html.dark.tx-js-booting #root::after {
        border-color: rgba(52, 211, 153, 0.2);
        border-top-color: #34d399;
      }
      @keyframes tx-boot-spin { to { transform: rotate(360deg); } }
      @keyframes tx-boot-reveal { to { opacity: 1; } }
    </style>
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem("tawzeef-x-theme") || "light";
          var resolved = t === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : (t === "dark" ? "dark" : "light");
          d.classList.add(resolved, "tx-js-booting");
          var p = localStorage.getItem("tawzeef-x-primary");
          if (p) d.style.setProperty("--primary", p);
          window.__txBootFallback = setTimeout(function () {
            d.classList.remove("tx-js-booting");
          }, 5000);
        } catch (e) {}
      })();
    </script>
