name: Supabase historical migration audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-migrations.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-migrations:
    name: Replay database migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - name: Check migration filenames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = list(Path('supabase/migrations').glob('*.sql'))
          invalid = [str(path) for path in paths if not re.fullmatch(r'\d{14}_.+\.sql', path.name)]
          versions = [path.name[:14] for path in paths]
          if invalid or len(set(versions)) != len(versions):
              raise SystemExit(f'Invalid migration names: {invalid}; duplicate versions: {len(versions) - len(set(versions))}')
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start database and replay migrations
        run: supabase db start
      - name: Verify isolated schema guardrails
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$database_container"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF has_function_privilege('authenticated', 'public.delete_company_permanently(uuid,uuid)', 'EXECUTE')
               OR has_function_privilege('anon', 'public.delete_company_permanently(uuid,uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Client roles must not execute permanent deletion';
            END IF;
            IF to_regprocedure('public.create_agency_account(text,text,text,text,uuid,uuid)') IS NOT NULL THEN
              RAISE EXCEPTION 'Unsafe account provisioning function is active';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.webhook_deliveries'::regclass) THEN
              RAISE EXCEPTION 'Webhook delivery RLS must be enabled';
            END IF;
          END $$;
          SQL
      - name: Exercise synthetic signup role assignment
        run: |
          database_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          docker exec -i "$database_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO auth.users (
            id, instance_id, aud, role, email, encrypted_password,
            email_confirmed_at, raw_app_meta_data, raw_user_meta_data, created_at, updated_at
          ) VALUES (
            '00000000-0000-4000-8000-000000000099',
            '00000000-0000-0000-0000-000000000000',
            'authenticated', 'authenticated', 'test-tawzeef@example.invalid',
            'synthetic-disabled-password', now(),
            '{"provider":"email","providers":["email"]}'::jsonb,
            '{"role":"admin","account_type":"job_seeker","full_name":"Synthetic Test"}'::jsonb,
            now(), now()
          );
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM public.user_roles
              WHERE user_id = '00000000-0000-4000-8000-000000000099'
                AND role = 'admin'
            ) THEN
              RAISE EXCEPTION 'Signup metadata promoted a test user to admin';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.user_roles
              WHERE user_id = '00000000-0000-4000-8000-000000000099'
                AND role = 'job_seeker'
            ) THEN
              RAISE EXCEPTION 'Job seeker role was not assigned';
            END IF;
          END $$;
          ROLLBACK;
          SQL
      - name: Stop local database
        if: always()
        run: supabase stop
